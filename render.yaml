services:
  - type: web
    name: ai-pet-companion
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: AIGW_APP_ID
        sync: false
      - key: AIGW_APP_KEY
        sync: false
      - key: DM_ACCESS_KEY
        sync: false
      - key: DM_SECRET_KEY
        sync: false
      - key: DM_SUB_APP
        value: gpt-image-2.5-sunburst
      - key: AIGW_IMAGE_MODEL
        value: gpt-image-2.5-sunburst
